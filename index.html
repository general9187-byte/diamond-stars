<!DOCTYPE html>
<html lang="ja">
<head>

<title>ダイヤモンド・スターズ 〜プロスタジアム〜</title>
<style>html,body,button,canvas{touch-action:manipulation}</style>
<style>
:root{--navy:#0b1e3a;--gold:#f2c14e;--red:#d8303a;--green:#2f9e5a;--ink:#101828;--paper:#f6f3e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1e3a;color:#fff;touch-action:none;overscroll-behavior:none;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;font-weight:800}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#zone{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hide{display:none!important}
.hud{position:fixed;pointer-events:none;z-index:2;text-shadow:0 1px 3px #000}
#score{left:max(8px,env(safe-area-inset-left));top:6px;background:#0b1e3acc;border:2px solid #f2c14e88;border-radius:10px;padding:5px 9px;font-size:12px;min-width:150px}
#score table{border-collapse:collapse;width:100%}
#score td{padding:1px 4px;font-variant-numeric:tabular-nums}#score td.n{font-size:20px;text-align:right;color:var(--gold)}
#score .inn{font-size:11px;opacity:.9;margin-bottom:2px}
.bso{display:flex;gap:10px;margin-top:3px;align-items:center;font-size:10px}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;background:#ffffff33;display:inline-block}
.dots.b i.on{background:#3fe07a}.dots.s i.on{background:#ffd23a}.dots.o i.on{background:#ff4a4a}
#bases{position:relative;width:34px;height:30px;margin-left:auto}
#bases i{position:absolute;width:10px;height:10px;transform:rotate(45deg);background:#ffffff33;border:1px solid #fff8}
#bases i.on{background:#ffd23a}
#bases i:nth-child(1){left:22px;top:10px}#bases i:nth-child(2){left:12px;top:0}#bases i:nth-child(3){left:2px;top:10px}
#info{right:max(8px,env(safe-area-inset-right));top:6px;background:#0b1e3acc;border:2px solid #f2c14e88;border-radius:10px;padding:5px 9px;font-size:11px;max-width:44vw;text-align:right;line-height:1.5}

#banner{left:0;right:0;top:34%;text-align:center;font-size:clamp(26px,7vmin,52px);-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000;opacity:0;letter-spacing:.05em}

.ctl{position:fixed;z-index:3}

.round{border-radius:50%;display:grid;place-items:center}

#bPower{right:calc(max(18px,env(safe-area-inset-right)) + min(28vmin,128px));bottom:max(18px,env(safe-area-inset-bottom));width:min(18vmin,84px);height:min(18vmin,84px);font-size:12px}
#bSp{right:max(22px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + min(28vmin,128px));width:min(18vmin,84px);height:min(18vmin,84px);font-size:12px;background:linear-gradient(#a24aff,#5a1ab0);border-color:#e0baff}

.panel>*{flex-shrink:0}
.pv{width:min(94vw,440px);height:min(44vh,300px);border:3px solid #fff6;border-radius:12px;background:radial-gradient(ellipse at 50% 30%,#2d5aa8,#0b1e3a);position:relative;overflow:hidden;touch-action:none}
.pv canvas{position:absolute;inset:0;width:100%;height:100%}.pv small{position:absolute;left:8px;bottom:4px;font-size:10px;opacity:.8;font-weight:600}
.abd{font-size:11px;text-align:left;line-height:1.5;margin-top:4px;font-weight:600}
#hintBat{left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));font-size:12px;opacity:.85;pointer-events:none;text-shadow:0 1px 3px #000}

#aimPad{left:18%;right:18%;top:14%;bottom:34%;z-index:2}
#throwPad{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:min(34vmin,160px);height:min(34vmin,160px);border:3px dashed #ffd2a0;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:12px;background:#d8303a44;z-index:3}
#runBtns{left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:3}

#fieldBtns .btn{padding:5px 9px;font-size:12px}
#roleTag{left:50%;transform:translateX(-50%);top:6px;font-size:11px;background:#d8303acc;border-radius:10px;padding:3px 10px;letter-spacing:.1em}
/* menus */
.panel{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:14px;overflow:auto;text-align:center;
  background:radial-gradient(ellipse at 50% 0%,#1d4c9acc,#0b1e3af4 70%)}
.panel.mid>:first-child{margin-top:auto}.panel.mid>:last-child{margin-bottom:auto}
.logo{font-size:clamp(26px,7vmin,50px);line-height:1.1;margin:6px 0 0;color:#fff;text-shadow:0 0 18px #4da3ff,0 4px 0 #000;letter-spacing:.04em}
.logo small{display:block;font-size:12px;color:var(--gold);letter-spacing:.3em;margin-bottom:4px}
.mbtn{width:min(86vw,360px);padding:12px;font-size:17px;border:3px solid #fff;border-radius:12px;background:linear-gradient(#2a64c8,#143a80);box-shadow:0 4px 0 #000a;letter-spacing:.08em;position:relative}
.mbtn small{display:block;font-size:11px;opacity:.85;font-weight:600;letter-spacing:0}
.mbtn.gold{background:linear-gradient(#f2c14e,#b8861a);color:#201400;border-color:#fff3c0}
.mbtn.red{background:linear-gradient(#e0444e,#8a1820)}

.seg{display:flex;width:min(86vw,360px);border:3px solid #fff;border-radius:10px;overflow:hidden}

.small{font-size:12px;line-height:1.6;max-width:560px;opacity:.92}
.head{display:flex;gap:10px;align-items:center;justify-content:space-between;width:min(94vw,640px)}
.head h2{margin:0;font-size:20px}.tk{background:#0008;border:2px solid var(--gold);border-radius:20px;padding:3px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:min(94vw,680px)}
.card{background:linear-gradient(#233a66,#142446);border:3px solid #6a7aa0;border-radius:10px;padding:6px 7px;text-align:left;font-size:11px;line-height:1.45;position:relative}
.card.r1{border-color:#8a96b0}.card.r2{border-color:#4aa8ff}.card.r3{border-color:#c47aff;background:linear-gradient(#3a2a66,#1a1446)}.card.r4{border-color:#ffd23a;background:linear-gradient(#6a4a10,#2a1a06);box-shadow:0 0 12px #ffd23a88}
.card b{font-size:13px;display:block}.card .rar{position:absolute;right:6px;top:4px;font-size:11px;color:var(--gold)}
.card.sel{outline:3px solid #fff}
.stat{display:grid;grid-template-columns:auto 1fr auto;gap:0 5px;align-items:center}
.stat i{display:block;height:5px;background:#ffffff22;border-radius:3px;overflow:hidden}.stat i s{display:block;height:100%;background:linear-gradient(90deg,#4da3ff,#f2c14e)}
.ab{display:inline-block;background:#d8303a;border-radius:6px;padding:0 5px;margin:1px 2px 0 0;font-size:10px}
.slot{background:#0b1e3a;border:2px dashed #fff6;border-radius:8px;padding:4px 8px;margin:3px 0;text-align:left;font-size:12px;width:min(94vw,420px)}
.slot.sel{border-color:var(--gold);background:#1d3a6a}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:min(94vw,680px)}
.stage{background:#17315c;border:3px solid #fff8;border-radius:10px;padding:8px;text-align:left;font-size:12px;position:relative}
.stage.lock{opacity:.45}.stage.clear{border-color:var(--gold)}.stage .star{color:var(--gold)}
input.in{width:min(86vw,320px);padding:10px;font-size:26px;text-align:center;letter-spacing:.25em;text-transform:uppercase;background:#0008;color:var(--gold);border:3px solid #fff;border-radius:10px;font-family:monospace;-webkit-user-select:text;user-select:text}
.code{font-size:46px;letter-spacing:.2em;color:var(--gold);text-shadow:0 3px 0 #000;font-family:monospace}
#err{color:#ff9a8a;font-size:13px;min-height:1.3em}
#loading{z-index:9}
.gachaRes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;width:min(94vw,640px)}
.gachaRes .card{animation:pop .4s ease-out both}
@keyframes pop{0%{transform:scale(.2) rotate(-15deg);opacity:0}100%{transform:none;opacity:1}}
#rot{display:none}
#vs{position:fixed;left:50%;top:22%;transform:translateX(-50%);width:min(94vw,560px);z-index:5;background:linear-gradient(#0b1e3aee,#0b1e3acc);border:3px solid #f2c14e;border-radius:14px;padding:8px 10px;pointer-events:none;text-shadow:0 1px 3px #000}
#vs.show{animation:vsin .35s ease-out}@keyframes vsin{from{opacity:0;transform:translateX(-50%) scale(.85)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px}.vl{flex:1;font-size:12px;line-height:1.4}.vl.r{text-align:right}.vl b{display:block;font-size:16px}.vl small{display:block;font-size:10px;opacity:.9}.vm{font-size:26px;color:#f2c14e;align-self:center;font-style:italic;letter-spacing:.05em}
.vr{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin:3px 0;font-size:11px}.vr label{min-width:96px;text-align:center;opacity:.95}
.vb{height:14px;background:#ffffff1f;border-radius:7px;position:relative;overflow:hidden}.vb i{position:absolute;top:0;bottom:0;border-radius:7px;transition:width .6s}.vb.l i{right:0}.vb.r i{left:0}.vb span{position:absolute;top:-1px;font-size:11px;padding:0 5px}.vb.l span{left:2px}.vb.r span{right:2px}
.vadv{text-align:center;font-size:18px;margin-top:4px;letter-spacing:.1em}
#vs .ab{display:inline-block;margin:2px 3px 0 0}.vl.r div{text-align:right}
.cutin{position:fixed;left:0;right:0;top:30%;z-index:7;pointer-events:none;opacity:0;transform:translateX(-110%) skewX(-12deg)}
.cutin.p{transform:translateX(110%) skewX(-12deg)}
.cutin.go{animation:cin 1.05s cubic-bezier(.2,.9,.2,1) forwards}.cutin.big.go{animation:cin 1.5s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes cin{0%{opacity:0;transform:translateX(-110%) skewX(-12deg)}15%{opacity:1;transform:translateX(0) skewX(-12deg)}80%{opacity:1;transform:translateX(0) skewX(-12deg)}100%{opacity:0;transform:translateX(30%) skewX(-12deg)}}
.cutin.p.go{animation-name:cinp}.cutin.big.p.go{animation-name:cinp}
@keyframes cinp{0%{opacity:0;transform:translateX(110%) skewX(-12deg)}15%{opacity:1;transform:translateX(0) skewX(-12deg)}80%{opacity:1;transform:translateX(0) skewX(-12deg)}100%{opacity:0;transform:translateX(-30%) skewX(-12deg)}}
.cband{margin:0 auto;width:min(96vw,640px);padding:8px 18px;text-align:center;border-top:3px solid #fff;border-bottom:3px solid #fff;background:linear-gradient(90deg,#d8303acc,#ff8a3add,#d8303acc);box-shadow:0 0 24px #ff6a3a}
.cutin.p .cband{background:linear-gradient(90deg,#1a4aaacc,#4da3ffdd,#1a4aaacc);box-shadow:0 0 24px #4da3ff}
.cutin.big .cband{background:linear-gradient(90deg,#6a1ab0cc,#e05affdd,#6a1ab0cc);box-shadow:0 0 34px #e05aff;padding:14px 18px}
.cband small{display:block;font-size:12px;opacity:.95}.cband b{display:block;font-size:clamp(26px,7vmin,46px);-webkit-text-stroke:2px #000;paint-order:stroke fill;letter-spacing:.08em;text-shadow:0 3px 0 #000a}.cband span{font-size:12px}
.flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff,#fff0 70%)}.flash.go{animation:fl .5s ease-out}.flash.big.go{animation:fl .8s ease-out;background:radial-gradient(circle,#fff,#e05aff66 60%,#0000)}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
#bQuit{left:max(8px,env(safe-area-inset-left));bottom:56px;padding:3px 10px;font-size:11px;z-index:4;border-width:2px}
#fieldBtns span{white-space:nowrap}
@media (orientation:portrait){
  #fieldBtns{left:8px;transform:none;top:auto;bottom:max(14px,env(safe-area-inset-bottom));width:212px;flex-wrap:wrap;gap:4px}
  #fieldBtns .btn{padding:4px 8px;font-size:11px}
  #roleTag{display:none}
  #hintBat{bottom:150px;max-width:62vw}
  #bQuit{bottom:104px}
  #pitchTypes{top:46%}
  #runBtns{gap:5px}#runBtns .btn{padding:6px 9px;font-size:12px}
}
</style>
</head>
<body>
<canvas id="c"></canvas><canvas id="zone"></canvas>
<div id="hud" class="hide">
  <div class="hud" id="score"></div>
  <div class="hud" id="info"></div>
  <div class="hud" id="roleTag"></div>
  <div class="hud" id="banner"></div>
  <div class="hud" id="toast"></div>
  <div class="ctl hide" id="cursorPad"></div>
  <div class="ctl hide" id="aimPad"></div>
  <div class="ctl hide" id="pitchTypes"></div>
  <div class="ctl hide round" id="throwPad">⬆ スワイプで<br>投球</div>
  <button class="btn ctl round hide" id="bSwing">スイング</button>
  <button class="btn ctl round hide" id="bPower">パワー<br>OFF</button>
  <button class="btn ctl round hide" id="bSp">必殺</button>
  <div class="ctl hide" id="runBtns"><button class="btn" id="bSteal">盗塁</button><button class="btn" id="bGo">GO!</button><button class="btn" id="bBack">帰塁</button></div>
  <div class="ctl hide" id="fieldBtns"></div>
  <div class="hud hide" id="hintBat">画面をドラッグでミートカーソル移動 → 指を離した瞬間にスイング!</div>
</div>
<div id="vs" class="hide"></div><div id="cutin" class="ctl cutin"></div><div id="flash" class="flash"></div>
<div id="menu" class="panel mid"></div>
<div id="loading" class="panel mid"><h1 class="logo"><small>DIAMOND STARS</small>読み込み中…</h1></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {mergeGeometries,toCreasedNormals} from 'three/addons/utils/BufferGeometryUtils.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   ユーティリティ
   ============================================================ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const randn=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v);};
const sign=v=>v<0?-1:1;
let TS=1; // テスト用の時間倍率
const sleep=ms=>new Promise(r=>setTimeout(r,ms/TS));
const D2R=Math.PI/180;
const hy=(a,b)=>Math.hypot(a,b);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============================================================
   フィールド定数 (x:右が+, v:ホームからの前方距離[m])
   シーン座標: x, z=24-v
   ============================================================ */
const BASE_D=27.4;
const BASEP=[{x:0,v:0},{x:19,v:19},{x:0,v:38},{x:-19,v:19}];
const FPOS={P:{x:0,v:22},C:{x:0,v:-2.4},B1:{x:17,v:24},B2:{x:8.5,v:35},B3:{x:-17,v:24},SS:{x:-8.5,v:35},LF:{x:-27,v:56},CF:{x:0,v:63},RF:{x:27,v:56}};
const POS_KEYS=['P','C','B1','B2','B3','SS','LF','CF','RF'];
const POS_NAME={P:'投',C:'捕',B1:'一',B2:'二',B3:'三',SS:'遊',LF:'左',CF:'中',RF:'右'};
const fenceDist=psi=>70+Math.min(1,Math.abs(psi)/0.785)*4;
const sceneZ=v=>24-v;
const REL=.4;

/* ============================================================
   選手カード・能力
   ============================================================ */
const SURN=['佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤','吉田','山田','佐々木','山口','松本','井上','木村','林','清水','斎藤','森','池田','橋本','阿部','石川','前田','藤田','小川','岡田','後藤','村上','近藤','石井','坂本','遠藤','青木','西村','福田','太田','三浦'];
const GIVN=['翔','大輝','蓮','陸','悠斗','颯太','拓海','隼人','剛','健太','誠','圭','勇気','直樹','亮','優','光','龍','哲也','雄大','慎吾','尚也','裕太','海斗','航','新','巧','豪','烈','俊','涼','貴','駿','叶','朝陽'];
const ABIL={
  genius:{n:'天才',t:'B',d:'ミートカーソルが大きくなる'},
  danto:{n:'弾道アップ',t:'B',d:'打球が上がりやすい'},
  wide:{n:'広角打法',t:'B',d:'逆方向にも強い打球'},
  clutch:{n:'チャンス◎',t:'B',d:'ランナーがいると打撃UP'},
  archer:{n:'アーチスト',t:'B',d:'会心の当たりは飛距離UP'},
  speedy:{n:'走塁◎',t:'B',d:'走るのが速い'},
  thief:{n:'盗塁◎',t:'B',d:'盗塁成功率UP'},
  ks:{n:'奪三振',t:'P',d:'空振りが増える'},
  heavy:{n:'重い球',t:'P',d:'打球が詰まりやすい'},
  sharp:{n:'キレ◎',t:'P',d:'変化球の曲がりUP'},
  fire:{n:'火消し',t:'P',d:'ピンチで制球UP'},
  quick:{n:'クイック◎',t:'P',d:'盗塁を阻止しやすい'},
  ace:{n:'球威◎',t:'P',d:'球速+4km/h'},
  stable:{n:'制球◎',t:'P',d:'コントロールブレが小さい'},
};
const ABIL_B=Object.keys(ABIL).filter(k=>ABIL[k].t==='B'),ABIL_P=Object.keys(ABIL).filter(k=>ABIL[k].t==='P');
// 球種: v=球速倍率, bu=横変化(捕手視点で右が+, 右投手基準), bw=縦変化
const PT={
  str:{n:'ストレート',v:1.0,bu:0,bw:.12},
  two:{n:'ツーシーム',v:.965,bu:-.45,bw:-.12},

function handleEv(ev){
  switch(ev.e){
    case 'start':
      V.teams=ev.teams;V.names=ev.teams.map(t=>t.name);V.innings=ev.innings;V.runners.clear();buildPark(ev.park);showHUD(true);hideMenu();$('loading').classList.add('hide');

      {const cb=(ev.teams[ME.team]&&ev.teams[ME.team].combos)||[];if(cb.length)setTimeout(()=>toast('パーティコンボ発動: '+cb.join(' / '),4200),1400);}buildFieldBtns();updateRoleUI();break;
    case 'inning':
      TW.length=0;hideTrail();batUIOff();ballMesh.visible=false;ballShadow.visible=false;V.off=ev.top?0:1;V.st=ev.st;setupHalf(V.off);refreshHUD(ev.st);
      banner(`${ev.inn}回${ev.top?'表':'裏'}`,'#fff');setCamMode('home');break;
    case 'atbat':{
      showVS(ev);
      TW.length=0;hideTrail();batUIOff();resetFieldPositions();for(const [,a] of V.runners)killActor(a);V.runners.clear();
      V.st=ev.st;V.view=myView();setBatter(ev.batter,ev.pitcher.hand);syncBases(ev.st);ballMesh.visible=false;ballShadow.visible=false;
      setInfo(ev.batter,ev.pitcher);refreshHUD(ev.st);setCamMode(V.view);V.mode='idle';
      if(myTeamOff()&&ME.roles.has('bat'))batUIOn();
      break;}
    case 'pitch':
      batUIOffKeep();TW.length=0;hideTrail();resetFieldPositions();V.batter&&V.batter.setPose('READY');showPitch(ev);
      {const t=`${ev.pitch.kph}km/h ${ev.pitch.name}`;toast(t,1500);}
      clearFlagBtns(true,false);
      if(myTeamOff()&&ME.roles.has('bat'))batUIOn();break;
    case 'abil':queueAbil(ev);break;
    case 'swing':
      if(ev.sw&&ev.sw.swung&&!V.swingShown)doSwing();
      if(ev.res.kind==='swingMiss'){sfx('catch');}
      batUIOffKeep();break;
    case 'contact':
      batUIOff();showContact(ev);if(ev.kind==='inplay'||ev.kind==='foul')toast(`打球速度 ${ev.ev}km/h  角度 ${ev.la}°`,2000);break;
    case 'play':showPlay(ev);clearFlagBtns(false,true);break;
    case 'banner':banner(ev.t,ev.c,ev.big);if(ev.st)refreshHUD(ev.st);break;
    case 'state':refreshHUD(ev.st);break;
    case 'end':batUIOff();onGameEnd(ev);break;
  }
}

const PV={r:null,scene:null,cam:null,model:null,ring:null,el:null,ang:.5,drag:null,pose:'READY',card:null,design:'PRO',raf:0};
function pvInit(){
  const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.toneMapping=THREE.ACESFilmicToneMapping;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;

  sc.add(new THREE.HemisphereLight(0xffffff,0x334466,.9));
  const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(3,6,4);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);Object.assign(dl.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:1,far:20});dl.shadow.bias=-.0005;sc.add(dl);
  const rim=new THREE.DirectionalLight(0x88b8ff,1.2);rim.position.set(-4,3,-4);sc.add(rim);
  const fl=new THREE.Mesh(new THREE.CircleGeometry(1.6,40),new THREE.MeshStandardMaterial({color:0x1d2f55,roughness:.8}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;sc.add(fl);
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.45,1.6,48),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.01;sc.add(ring);
  Object.assign(PV,{r,scene:sc,ring,cam:new THREE.PerspectiveCamera(30,1,.1,50)});
  const cv=r.domElement;
  cv.addEventListener('pointerdown',e=>{PV.drag={x:e.clientX,m:false};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!PV.drag)return;const dx=e.clientX-PV.drag.x;if(Math.abs(dx)>2)PV.drag.m=true;PV.ang+=dx*.012;PV.drag.x=e.clientX;});
  cv.addEventListener('pointerup',()=>{if(PV.drag&&!PV.drag.m)pvPose(PV.pose==='READY'?'ACTION':'READY');PV.drag=null;});
}
function pvPose(p){PV.pose=p;if(PV.model)for(const k in PV.model.poses)PV.model.poses[k].visible=k===p;}
function pvMount(el,card,design){
  if(!el||!card)return;if(!PV.r)pvInit();
  PV.el=el;PV.card=card;PV.design=design;PV.pose='READY';
  if(PV.model){PV.scene.remove(PV.model.root);PV.model=null;}
  const base=`${design}_${card.kind==='B'?'BATTER':'PITCHER'}`,root=new THREE.Group(),poses={};
  for(const p of ['READY','ACTION']){const m=MODELS[`${base}_${p}`];if(!m)continue;const g=m.group.clone();const hand=card.hand==='S'?'R':card.hand;if(hand!==m.hand)g.scale.x*=-1;tintModel(g,card);g.visible=p==='READY';root.add(g);poses[p]=g;}
  PV.scene.add(root);PV.model={root,poses};
  PV.ring.material.color.set([0,0x9aa4b8,0x4aa8ff,0xc47aff,0xffd23a][card.rar]);
  el.innerHTML='';el.appendChild(PV.r.domElement);const sm=document.createElement('small');sm.textContent='ドラッグで回転 / タップでポーズ切替';el.appendChild(sm);

function pvResize(){if(!PV.el)return;const w=PV.el.clientWidth||300,h=PV.el.clientHeight||260;PV.r.setSize(w,h,false);PV.cam.aspect=w/h;PV.cam.fov=w/h<.8?44:30;PV.cam.updateProjectionMatrix();}
function pvLoop(){
  if(!PV.el||!PV.el.isConnected){return;}
  PV.raf=requestAnimationFrame(pvLoop);if(!PV.drag)PV.ang+=.008;
  const m=PV.model.root;m.rotation.y=PV.ang;
  const t=performance.now()/1000;m.scale.y=1+Math.sin(t*2)*.006;

}

  ${slot>=0&&slot<9?`<div class="small">守備位置: <button class="btn" data-a="pm">◀ 上と交換</button> <button class="btn" data-a="pp">下と交換 ▶</button></div>`:''}
  ${comboPanel()}
  <button class="mbtn sub" data-a="auto">おまかせ編成<small>能力・コンボを考えて最強の布陣に</small></button><button class="mbtn" data-a="back">もどる</button>`);
  if(slot>=0){const cc=slot===9?pit:t[slot];if(cc)pvMount($('pv'),cc,SAVE.design);}
  $('tn').addEventListener('change',e=>{SAVE.teamName=e.target.value.trim()||'マイチーム';writeSave();});
  bindSeg('dsSeg',v=>{SAVE.design=v;writeSave();});
  bindMenu({pm:()=>{if(slot>0){const p=SAVE.pos;[p[slot],p[slot-1]]=[p[slot-1],p[slot]];writeSave();teamEdit(slot);}},pp:()=>{if(slot<8){const p=SAVE.pos;[p[slot],p[slot+1]]=[p[slot+1],p[slot]];writeSave();teamEdit(slot);}},slot:b=>teamEdit(+b.dataset.i),back:()=>{SAVE.teamName=$('tn').value.trim()||'マイチーム';writeSave();title();},auto:()=>{autoTeam(SAVE);writeSave();teamEdit(-1);},
    pick:b=>{const id=+b.dataset.id;
      if(slot===9)SAVE.pitcher=id;else{const j=SAVE.lineup.indexOf(id);if(j>=0)SAVE.lineup[j]=SAVE.lineup[slot];SAVE.lineup[slot]=id;}
      writeSave();teamEdit(slot);}});
}
/* ---------- オンライン ---------- */
function onlineMenu(){
  M(`<h2>オンライン対戦</h2><div class="small">友だちとルームコードを共有して遊ぼう。<br>※ 通信状況により遅延する場合があります。</div>${seg('inSeg',[[3,'3回'],[5,'5回'],[9,'9回']],G.innings||5)}
  <button class="mbtn gold" data-a="h1">1対1ルームを作る<small>おたがいの自チームで対戦</small></button>
  <button class="mbtn" data-a="hc">協力プレイルームを作る<small>2〜4人で役割分担してCPUと対戦</small></button>
  <button class="mbtn red" data-a="join">ルームに参加する</button><button class="mbtn sub" data-a="back">もどる</button>`);
  let inn=G.innings||5;bindSeg('inSeg',v=>{inn=+v;G.innings=inn;});
  bindMenu({back:title,h1:()=>hostRoom('1v1',inn),hc:()=>hostRoom('coop',inn),join:joinScr});
}
const SPLIT={1:[['bat','pitch','run','field']],2:[['bat','run'],['pitch','field']],3:[['bat'],['pitch'],['run','field']],4:[['bat'],['pitch'],['run'],['field']]};
async function hostRoom(kind,inn,stageIdx){
  NET.close();NET.host=true;NET.kind=kind;let stage=stageIdx??Math.min(SAVE.cleared,STAGES.length-1);
  M(`<h2>${kind==='1v1'?'1対1':'協力プレイ'}ルーム</h2><div class="small">接続中…</div>`);
  let code='';let peer=null;
  for(let i=0;i<5&&!peer;i++){code=randCode();try{peer=await new Promise((res,rej)=>{const p=new Peer('dsb-'+code);p.on('open',()=>res(p));p.on('error',e=>rej(e));});}catch(e){if(e.type!=='unavailable-id'){M(`<h2>接続できませんでした</h2><div class="small">${esc(e.type||e.message||'')}</div><button class="mbtn" data-a="b">もどる</button>`);bindMenu({b:onlineMenu});NET.close();return;}}}
  if(!peer){onlineMenu();return;}
  NET.peer=peer;NET.code=code;NET.players=[];
  peer.on('connection',conn=>{
    if(NET.players.length>=(kind==='1v1'?1:3)){conn.on('open',()=>{conn.send({t:'full'});setTimeout(()=>conn.close(),300);});return;}
    const p={conn,name:'ゲスト',team:kind==='1v1'?1:0,roles:[],waiting:null,deck:null};NET.players.push(p);
    conn.on('data',m=>onHostMsg(p,m));
    conn.on('close',()=>{NET.players=NET.players.filter(x=>x!==p);if(p.waiting){const w=p.waiting;p.waiting=null;w.res({swung:false,cu:0,cw:0,dt:0,type:'str',tu:0,tw:0,q:.6});}
      if(E.ctl)for(const ti of [0,1])for(const r of ['bat','pitch'])if(E.ctl[ti][r]&&E.ctl[ti][r].peer===p)E.ctl[ti][r]={kind:'cpu'};
      if(G.promise)toast(`${p.name}が切断しました`,3000);else refresh();});
    refresh();
  });
  peer.on('error',e=>toast('通信エラー: '+(e.type||''),3000));
  const refresh=()=>{
    if(G.promise)return;
    const ready=NET.players.filter(p=>kind==='1v1'?p.deck:true);
    M(`<h2>${kind==='1v1'?'1対1':'協力プレイ'}ルーム</h2><div class="small">友だちにこのコードを伝えてね</div><div class="code">${code}</div>
    <div class="small">参加者: あなた${NET.players.map(p=>'、'+esc(p.name)).join('')}</div>
    ${kind==='coop'?`<div class="small">対戦相手: ${esc(STAGES[stage].n)}　<button class="btn" data-a="sp">◀</button> <button class="btn" data-a="sn">▶</button></div><div class="small">${NET.players.length+1}人 → 役割: ${SPLIT[NET.players.length+1].map((r,i)=>(i?'P'+(i+1):'あなた')+'='+r.map(x=>ROLE_N[x]).join('')).join(' / ')}</div>`:''}
    <button class="mbtn gold" data-a="start" ${ready.length<1?'disabled':''}>${ready.length<1?'参加者を待っています…':'試合開始!'}</button><button class="mbtn sub" data-a="cancel">やめる</button>`);
    bindMenu({cancel:()=>{NET.close();onlineMenu();},sp:()=>{stage=Math.max(0,stage-1);refresh();},sn:()=>{stage=Math.min(SAVE.cleared,STAGES.length-1,stage+1);refresh();},start:()=>startOnline(kind,inn,stage)});
  };
  refresh();
}
function onHostMsg(p,m){
  if(m.t==='join'){p.name=String(m.name||'ゲスト').slice(0,8);p.deck=m.deck||null;if(NET.kind==='1v1'&&!p.deck){p.conn.send({t:'full'});return;}
    try{p.conn.send({t:'room',kind:NET.kind});}catch(e){}
    if(!G.promise)hostRefresh();}
  else if(m.t==='ans'){if(p.waiting){const w=p.waiting;p.waiting=null;w.res(m.ans);}}
  else if(m.t==='flag'){const need=(m.k==='thr')?'field':'run';if(p.roles.includes(need)&&['steal','go','thr'].includes(m.k))setFlag(p.team,m.k,+m.v);}
}
function hostRefresh(){const e=document.querySelector('[data-a="cancel"]');if(e)e.dispatchEvent(new Event('x'));/* 画面更新はconnection側のrefresh任せ */
  const btn=document.querySelector('[data-a="start"]');if(btn&&NET.players.some(p=>NET.kind==='1v1'?p.deck:true)){btn.disabled=false;btn.textContent='試合開始!';}
  const small=[...document.querySelectorAll('#menu .small')].find(x=>x.textContent.startsWith('参加者'));if(small)small.textContent='参加者: あなた'+NET.players.map(p=>'、'+p.name).join('');}
function startOnline(kind,inn,stage){
  const my=applyCombos(myTeam());ME.team=0;
  if(kind==='1v1'){
    const p=NET.players.find(x=>x.deck);if(!p){toast('相手が準備できていません');return;}
    const d=p.deck;const other=applyCombos({name:d.name||'ゲスト',design:opposite(my.design),lineup:d.lineup,pitcher:d.pitcher,pos:d.pos||DEFPOS});
    for(const c of [...other.lineup,other.pitcher])if(c&&c.abil===undefined)c.abil=[];
    p.team=1;p.roles=['bat','pitch','run','field'];ME.roles=new Set(['bat','pitch','run','field']);
    p.conn.send({t:'hello',kind,team:1,roles:p.roles});
    startGame({mode:'online',innings:inn,park:pick([0,1,2]),teams:[my,other],ctl:[{pitch:{kind:'local'},bat:{kind:'local'}},{pitch:{kind:'remote',peer:p},bat:{kind:'remote',peer:p}}],lv:[0,0],cpuRun:[false,false]});
  }else{
    const n=NET.players.length+1;const sp=SPLIT[n];const cpu=genCpuTeam(stage,opposite(my.design));
    ME.roles=new Set(sp[0]);NET.players.forEach((p,i)=>{p.team=0;p.roles=sp[i+1];p.conn.send({t:'hello',kind,team:0,roles:p.roles});});
    const holder=r=>{if(sp[0].includes(r))return {kind:'local'};const p=NET.players.find(x=>x.roles.includes(r));return {kind:'remote',peer:p};};
    startGame({mode:'coop',stage,innings:inn,park:STAGES[stage].park,teams:[my,cpu],ctl:[{pitch:holder('pitch'),bat:holder('bat')},{pitch:{kind:'cpu'},bat:{kind:'cpu'}}],lv:[0,stage+1],cpuRun:[false,true]});
  }
}
function joinScr(){
  M(`<h2>ルームに参加</h2><div class="small">ホストから教えてもらった4文字のコードを入力</div><input class="in" id="jc" maxlength="4" placeholder="ABCD" autocomplete="off"><div id="err"></div>
  <button class="mbtn gold" data-a="go">接続する</button><button class="mbtn sub" data-a="back">もどる</button>`);
  bindMenu({back:onlineMenu,go:()=>joinRoom($('jc').value.trim().toUpperCase())});
}
async function joinRoom(code){
  const err=m=>{const e=$('err');if(e)e.textContent=m;};
  if(code.length!==4){err('4文字のコードを入力してね');return;}
  err('接続中…');NET.close();NET.guest=true;
  try{
    const peer=await new Promise((res,rej)=>{const p=new Peer();p.on('open',()=>res(p));p.on('error',e=>rej(e));});NET.peer=peer;
    const conn=peer.connect('dsb-'+code,{reliable:true});NET.hostConn=conn;
    await new Promise((res,rej)=>{conn.on('open',res);conn.on('error',rej);peer.on('error',rej);setTimeout(()=>rej({type:'timeout'}),12000);});
    const my=myTeam();conn.send({t:'join',name:SAVE.teamName,deck:{name:SAVE.teamName,lineup:my.lineup,pitcher:my.pitcher,pos:my.pos}});
    conn.on('data',onGuestMsg);
    conn.on('close',()=>{if(!NET.guest)return;NET.guest=false;abortGame();toast('ホストとの接続が切れました',3500);showHUD(false);title();});
    M(`<h2>接続しました!</h2><div class="small">ホストが試合を開始するのを待っています…</div><div class="code">${code}</div><button class="mbtn sub" data-a="back">やめる</button>`);
    bindMenu({back:()=>{NET.close();onlineMenu();}});
  }catch(e){NET.close();joinScr();setTimeout(()=>err(e&&e.type==='peer-unavailable'?'ルームが見つかりません':'接続できませんでした ('+(e.type||'')+')'),50);}
}
function onGuestMsg(m){
  if(m.t==='hello'){ME.team=m.team;ME.roles=new Set(m.roles);G.mode=m.kind==='coop'?'coop':'online';G.stage=-1;V.runners.clear();
    E.emit=()=>{};G.id++;}
  else if(m.t==='ev'){
    if(m.ev.e==='start')G.over=false;handleEv(m.ev);}
  else if(m.t==='ask'){runAsk(m.role,m.ctx,a=>{try{NET.hostConn.send({t:'ans',role:m.role,ans:a});}catch(e){}});}
  else if(m.t==='full'){NET.close();M(`<h2>参加できません</h2><div class="small">ルームが満員か、受付していません。</div><button class="mbtn" data-a="b">もどる</button>`);bindMenu({b:onlineMenu});}
  else if(m.t==='room'){}
  else if(m.t==='bye'){NET.guest=false;if(CT.abort)CT.abort();toast('ホストが退出しました',3500);showHUD(false);setTimeout(title,600);}
}
/* 中断ボタン */
(()=>{const b=document.createElement('button');b.className='btn ctl';b.id='bQuit';b.textContent='中断';$('hud').appendChild(b);
  b.addEventListener('click',async()=>{if(!confirm('試合を中断してタイトルへ戻りますか?'))return;leaveOnline();G.id++;batUIOff();showHUD(false);await abortGame();title();});})();
/* ---------- 起動 ---------- */
(async function boot(){
  SAVE=loadSave();if(SAVE.coins===undefined)SAVE.coins=0;writeSave();
  window.DSS={step:dt=>{updTW(dt);},CAMV,MODELS,STAD,renderer,scene,ME,myTeam,genCpuTeam,opposite,setTS:v=>{TS=v;},camera,camNow,TW,startGame,startCpuStage,handleEv,SAVE:()=>SAVE,V,E,G,CT,UI,title};
  try{await loadAssets();}catch(e){$('loading').innerHTML='<h1 class="logo">読み込みに失敗しました</h1><div class="small">'+esc(e.message||e)+'</div>';return;}
  buildPark(2);loop();$('loading').classList.add('hide');title();
})();

</script>
